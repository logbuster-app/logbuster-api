[project]
name = "logbuster-api"
version = "0.1.0"
description = "API de avaliações e interações com filmes do Logbuster."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "alembic>=1.18,<2",
    "fastapi==0.135.3",
    "httpx>=0.28,<0.29",
    "psycopg[binary]>=3.3,<4",
    "pydantic>=2.12,<3",
    "python-dotenv>=1.2,<2",
    "sqlalchemy>=2.0,<2.1",
    # Mantém TestClient compatível com HTTPX 0.28 (Starlette 1 migra para HTTPX2).
    "starlette>=0.52,<1",
    "uvicorn>=0.47,<1",
]

[dependency-groups]
dev = [
    "httpx>=0.28,<0.29",
    "pre-commit>=4.6,<5",
    "pytest>=9,<10",
    "pytest-cov>=6,<8",
    "ruff==0.17.4",
]

[tool.ruff]
target-version = "py312"
line-length = 88

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I", "UP", "B"]

[tool.ruff.lint.isort]
known-third-party = ["alembic"]
